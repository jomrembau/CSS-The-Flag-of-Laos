<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    .flag {
      background-color: rgb(206, 17, 38);
      width: 900px;
      height: 600px;
      font-size: 5rem;
      text-align: center;
    }

    .flag > div {
      width: 900px;
      height: 300px;
      background-color: rgb(0, 40, 104);
      
    }

    .flag > p {
      color: white;
    }

    div div p {
      background-color: white;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      position: absolute;
      text-align: center;
      font-size: 5rem;
      position: absolute;
      left: 350px;
      top: 220px
    }
    
  </style>
</head>

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
